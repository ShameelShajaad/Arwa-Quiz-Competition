<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0B0908" />
<link rel="icon" href="assets/logo.png" />
<title>School Device | ARWA Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="font-body min-h-screen flex items-center justify-center px-4 py-8 relative z-10">
  <button id="fsBtn" class="btn-outline text-xs fixed top-4 right-4 z-50">⛶ FULLSCREEN</button>

  <main class="w-full max-w-lg glass p-6 sm:p-8 animate-in">
    <div class="flex items-center justify-between mb-3">
      <h1 id="teamName" class="font-display text-xl gold-text tracking-wide">SCHOOL</h1>
      <div class="timer-ring-wrap w-16 h-16">
        <svg viewBox="0 0 100 100" width="64" height="64">
          <defs>
            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#F4D03F" />
              <stop offset="100%" stop-color="#D4AF37" />
            </linearGradient>
          </defs>
          <circle class="timer-ring-bg" cx="50" cy="50" r="44" stroke-width="8"></circle>
          <circle id="ringFg" class="timer-ring-fg" cx="50" cy="50" r="44" stroke-width="8"
            stroke-dasharray="276.46" stroke-dashoffset="0"></circle>
        </svg>
        <span id="timer" class="timer-value text-lg">15</span>
      </div>
    </div>

    <div class="progress-track mb-4"><div id="progressFill" class="progress-fill" style="width:0%"></div></div>
    <p id="questionNo" class="text-xs text-muted tracking-widest uppercase mb-2">Waiting…</p>
    <p id="question" class="text-lg sm:text-xl font-medium leading-relaxed mb-6">Waiting for host…</p>

    <div class="grid gap-3" id="options">
      <button id="a0" class="option-btn" disabled>—</button>
      <button id="a1" class="option-btn" disabled>—</button>
      <button id="a2" class="option-btn" disabled>—</button>
      <button id="a3" class="option-btn" disabled>—</button>
    </div>

    <p id="answeredNote" class="text-center text-sm text-muted mt-5 hidden">Answer submitted — locked</p>
    <p id="statusNote" class="text-center text-xs text-muted mt-3">Round 1 only — options appear after Host reveals them</p>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/team.js"></script>
</body>
</html>
