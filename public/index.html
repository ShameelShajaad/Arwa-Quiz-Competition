<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0B0908" />
<link rel="icon" href="assets/logo.png" />
<title>ARWA Quiz Competition</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="font-body min-h-screen flex items-center justify-center px-4 py-8 relative z-10">
  <button id="fsBtn" class="btn-outline text-xs fixed top-4 right-4 z-50">⛶ FULLSCREEN</button>

  <main class="w-full max-w-md glass p-8 sm:p-10 text-center animate-in">
    <img src="assets/logo.png" alt="ARWA" class="w-20 h-20 mx-auto mb-4 object-contain opacity-90" onerror="this.style.display='none'" />

    <h1 class="font-display text-3xl sm:text-4xl gold-text tracking-wide">ARWA QUIZ COMPETITION</h1>

    <div class="ornament my-5">
      <span class="diamond"></span>
    </div>

    <p class="text-muted text-sm sm:text-base mb-8">Official inter-school quiz tournament. Choose how you join.</p>

    <div class="grid gap-4">
      <button id="hostBtn" class="btn-gold w-full">HOST DASHBOARD</button>
      <button id="teamBtn" class="btn-outline w-full">JOIN AS SCHOOL</button>
      <button id="displayBtn" class="btn-outline w-full">OPEN PROJECTOR DISPLAY</button>
    </div>
  </main>

  <div id="teamModal" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/70 backdrop-blur-sm px-4">
    <div class="glass w-full max-w-lg p-8 animate-in max-h-[90vh] overflow-y-auto">
      <h2 class="font-display text-2xl gold-text text-center mb-2">SELECT YOUR SCHOOL</h2>
      <p class="text-muted text-xs text-center mb-6">School names are set by the Host. Join with the correct name.</p>
      <div id="schoolList" class="grid gap-3">
        <p class="text-muted text-sm text-center">Waiting for Host to set school names…</p>
      </div>
      <button id="closeModal" class="btn-outline w-full mt-6">CANCEL</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
