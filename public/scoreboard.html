<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Leaderboard</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
}

.team{
margin:20px auto;
padding:20px;
width:400px;
background:#222;
border-radius:15px;
font-size:30px;
transition:.4s;
}

</style>

</head>

<body>

<h1>🏆 LIVE LEADERBOARD</h1>

<div id="scores"></div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io({
    transports: ["websocket"]
});

socket.on("leaderboard",(teams)=>{

teams.sort((a,b)=>b.score-a.score);

let html="";

teams.forEach((team,index)=>{

html += `
<div class="team">
${index+1}. Team ${team.id}<br>
${team.score} Points
</div>
`;

});

document.getElementById("scores").innerHTML=html;

});

</script>

</body>

</html>
